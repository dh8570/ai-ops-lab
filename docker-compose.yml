name: ai-ops-lab

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  app:
    build: ./app
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      LOG_PATH: /var/log/app/app.jsonl
    volumes:
      - app-logs:/var/log/app
    ports:
      - "${APP_BIND_IP}:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  loadgen:
    build: ./scripts/loadgen
    init: true
    profiles: ["load"]
    depends_on:
      - app
  
  
  traffic:
    build: ./scripts/loadgen
    init: true
    command: ["--rps", "5", "--duration", "3600"]
    profiles: ["traffic"]
    depends_on:
      - app
    restart: unless-stopped
  
  watcher:
    build: ./watcher
    environment:
      LOG_PATH: /var/log/app/app.jsonl
      WINDOW_SEC: ${WATCHER_WINDOW_SEC:-60}
      STATE_PATH: /data/watcher.db
      NOTIFY_PROVIDER: ${NOTIFY_PROVIDER:-slack}
      NOTIFY_WEBHOOK_URL: ${NOTIFY_WEBHOOK_URL:-}
      # --- LLM 분석(A1). 기본값은 모두 "꺼짐·기존 동작". 값은 watcher/config.py의 기본값과 같다 ---
      OLLAMA_URL: ${WATCHER_OLLAMA_URL:-http://10.97.0.1:11434}   # 서버(controller1)의 Ollama. VM↔서버 통로 주소
      LLM_ENABLED: ${LLM_ENABLED:-0}                              # 1이면 FIRING 뒤에 AI 분석을 후속 메시지로 보낸다
      LLM_MODEL: ${LLM_MODEL:-qwen2.5:7b}                         # Ollama 모델 이름
      LLM_CONNECT_TIMEOUT_SEC: ${LLM_CONNECT_TIMEOUT_SEC:-5}      # 연결 제한(초)
      LLM_TIMEOUT_SEC: ${LLM_TIMEOUT_SEC:-30}                     # 분석 호출 하나의 총 상한(초)
      LLM_HOLD_SEC: ${LLM_HOLD_SEC:-0}                            # 알림을 붙잡는 시간. 0만 지원(0보다 크면 시작 거부)
      LLM_KEEP_ALIVE: ${LLM_KEEP_ALIVE:-24h}                      # 모델을 메모리에 유지하는 시간
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0}                      # 샘플링 옵션 7개(요청·기록에 항상 모두 명시)
      LLM_SEED: ${LLM_SEED:-42}
      LLM_TOP_K: ${LLM_TOP_K:-40}
      LLM_TOP_P: ${LLM_TOP_P:-0.9}
      LLM_REPEAT_PENALTY: ${LLM_REPEAT_PENALTY:-1.0}
      LLM_NUM_PREDICT: ${LLM_NUM_PREDICT:-512}
      LLM_NUM_CTX: ${LLM_NUM_CTX:-4096}
      LLM_TRACE_PATH: ${LLM_TRACE_PATH:-/data/llm_runs.jsonl}     # 분석 실행 기록(JSON Lines). watcher-state 볼륨 안
    volumes:
      - app-logs:/var/log/app:ro
      - watcher-state:/data
    depends_on:
      - app
    restart: unless-stopped
    stop_grace_period: 15s            # 종료 때 알림 큐를 최대 8초 비운다(기본 10s면 부족할 수 있음)

  # 파이프라인 탐험 사이트 S0 (문장 -> 토큰화 -> 읽기·쓰기 -> 복원). 기본 up에는 포함되지 않는다(profile).
  #   실행: docker compose --profile explorer up -d --build explorer
  explorer:
    build: ./explorer
    init: true                      # PID 1이 신호 전달·좀비 정리를 맡게 한다
    profiles: ["explorer"]          # --profile explorer를 줄 때만 뜬다
    restart: "no"                   # 자동 재시작 없음(학습용 도구)
    user: "10004"                   # 비root. Dockerfile의 explorer 사용자와 같은 uid
    environment:
      OLLAMA_URL: http://10.97.0.1:11434   # 서버 설정값. 화면에서 바꿀 수 없다
      DATA_DIR: /data                      # 실행 기록(runs/<id>.json, index.json)이 쌓이는 곳. 옛 traces.jsonl은 더 이상 쓰지 않는다
    volumes:
      - explorer-traces:/data
    ports:
      # tailnet 주소(APP_BIND_IP)에만 연다. 값이 비어 있으면 0.0.0.0으로 열리는 사고를 막기 위해 실행 자체를 거부한다.
      - "${APP_BIND_IP:?APP_BIND_IP가 비어 있습니다(.env 확인)}:8100:8100"

  # LLM 알림 합격 시험(F·G·H)용 가짜 Ollama. 기본 up에는 포함되지 않는다(profile). 사용법: docs/acceptance/llm-scenarios.md
  #   ports가 없으므로 호스트로 공개되지 않는다. 같은 compose 네트워크의 watcher가 http://fake-ollama:11434 로 부른다.
  fake-ollama:
    image: python:3.12-slim           # 새로 빌드하지 않고 서버 파일만 마운트한다(표준 라이브러리만 씀)
    profiles: ["llmtest"]             # --profile llmtest를 줄 때만 뜬다
    init: true                        # PID 1이 신호 전달·좀비 정리를 맡게 한다
    restart: "no"                     # 자동 재시작 없음(시험 도구)
    read_only: true                   # 컨테이너 파일 시스템을 쓰지 못하게 한다(서버는 파일을 쓰지 않는다)
    user: "65534:65534"               # nobody. 비root
    environment:
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"    # read_only라서 .pyc를 쓸 수 없다
    command: ["python", "/app/fake_ollama_server.py"]    # 0.0.0.0:11434에서 듣는다(컨테이너 안)
    volumes:
      - ./scripts/acceptance/fake_ollama_server.py:/app/fake_ollama_server.py:ro

volumes:
  db-data:
  app-logs:
  watcher-state:
  explorer-traces:
